<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Card Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Fantasy Card Generator</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="rankSelect">Card Rank:</label>
                <select id="rankSelect">
                    <option value="★">★</option>
                    <option value="★★">★★</option>
                    <option value="■">■</option>
                    <option value="■■">■■</option>
                    <option value="■■■■">■■■■</option>

                    <option value="">Blank</option>
                </select>
            </div>

            <div class="control-group">
                <label for="suitSelect">Suit:</label>
                <select id="suitSelect">
                    <option value="dragon">Dragon (🐉)</option>
                    <option value="knight">Knight (⚔️)</option>
                    <option value="fairy">Fairy (🧚)</option>
                    <option value="mage">Mage (🧙)</option>
                    <option value="villager">Villager (👨)</option>
                    <option value="castle">Castle (🏰)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="borderColor">Border Color:</label>
                <select id="borderColor">
                    <option value="#FFD700">Dragon (gold)</option>
                    <option value="#0066CC">Knight (blue)</option>
                    <option value="#CC0000">Mage (red)</option>
                    <option value="#00CC66">Fairy (green)</option>
                    <option value="#000000">Villager (black)</option>
                    <option value="#808080">Castle (grey)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="squareColor1">Square color #1:</label>
                <select id="squareColor1" class="square-color-select">
                    <option value="#FFD700">Dragon (gold)</option>
                    <option value="#0066CC">Knight (blue)</option>
                    <option value="#CC0000">Mage (red)</option>
                    <option value="#00CC66">Fairy (green)</option>
                    <option value="#000000">Villager (black)</option>
                    <option value="#808080">Castle (grey)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="squareColor2">Square color #2:</label>
                <select id="squareColor2" class="square-color-select">
                    <option value="#FFD700">Dragon (gold)</option>
                    <option value="#0066CC">Knight (blue)</option>
                    <option value="#CC0000">Mage (red)</option>
                    <option value="#00CC66">Fairy (green)</option>
                    <option value="#000000">Villager (black)</option>
                    <option value="#808080">Castle (grey)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="squareColor3">Square color #3:</label>
                <select id="squareColor3" class="square-color-select">
                    <option value="#FFD700">Dragon (gold)</option>
                    <option value="#0066CC">Knight (blue)</option>
                    <option value="#CC0000">Mage (red)</option>
                    <option value="#00CC66">Fairy (green)</option>
                    <option value="#000000">Villager (black)</option>
                    <option value="#808080">Castle (grey)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="squareColor4">Square color #4:</label>
                <select id="squareColor4" class="square-color-select">
                    <option value="#FFD700">Dragon (gold)</option>
                    <option value="#0066CC">Knight (blue)</option>
                    <option value="#CC0000">Mage (red)</option>
                    <option value="#00CC66">Fairy (green)</option>
                    <option value="#000000">Villager (black)</option>
                    <option value="#808080">Castle (grey)</option>
                </select>
            </div>
        </div>

        <div class="preview-section">
            <h2>Preview</h2>
            <canvas id="cardCanvas" width="400" height="600"></canvas>
        </div>

        <div class="button-group">
            <button id="generateBtn" class="btn btn-primary">Generate Card</button>
            <button id="downloadBtn" class="btn btn-success">Download as PNG</button>
        </div>

        <div class="info">
            <p>Select a rank, suit, and color scheme, then click "Generate Card" to create the fantasy card front. Use "Download as PNG" to save the image.</p>
        </div>
    </div>

    <script src="card-generator.js"></script>
</body>
</html>
